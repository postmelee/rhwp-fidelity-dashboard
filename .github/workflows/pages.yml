name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Prepare pinned per-path corpus inventory
        run: |
          repo="$RUNNER_TEMP/rhwp-corpus"
          rev="$(python3 -c 'import json; print(json.load(open("corpus/inventory-summary.json"))["source_revision"])')"
          git init -q "$repo"
          git -C "$repo" remote add origin https://github.com/edwardkim/rhwp.git
          git -C "$repo" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$rev"
          python3 scripts/corpus_inventory.py "$repo" --check --rows "$RUNNER_TEMP/corpus-rows.json"
          echo "DASHBOARD_INVENTORY_ROWS=$RUNNER_TEMP/corpus-rows.json" >> "$GITHUB_ENV"
      - name: Build from validated durable ledger
        env:
          REFRESH_RELEASE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python3 scripts/pipeline.py build --fetch-ledger
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for this attempt’s uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: python3 scripts/wait_pages_artifact.py
      - name: Deploy using OIDC
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw Error("Invalid Pages artifact ID")
            const repo = context.repo
            const token = await core.getIDToken()
            const {data} = await github.request("POST /repos/{owner}/{repo}/pages/deployments", {
              ...repo, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: token
            })
            core.setOutput("page_url", data.page_url)
            for (let poll = 0; poll < 100; poll++) {
              const {data: deployment} = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{id}", {
                ...repo, id: data.id
              })
              if (deployment.status === "succeed") return
              if (["deployment_failed", "deployment_content_failed", "deployment_cancelled", "deployment_lost"].includes(deployment.status)) {
                throw Error("Pages deployment: " + deployment.status)
              }
              await new Promise(resolve => setTimeout(resolve, 5000))
            }
            throw Error("Pages deployment did not report success")
      - name: Verify public HTML, assets and numeric records
        run: python3 scripts/verify_live_site.py
      - name: Check live inventory and release scores in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/cohort-browser" --no-save --ignore-scripts playwright-core@1.56.1
          export NODE_PATH="$RUNNER_TEMP/cohort-browser/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/cohort_live.cjs
