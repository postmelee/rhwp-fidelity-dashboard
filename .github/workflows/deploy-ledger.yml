name: Deploy recorded history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-ledger.yml']
permissions:
  contents: read
concurrency:
  group: recorded-history-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify trusted code and rebuild durable history without measurement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/pipeline.py publish --reuse
      - name: Read prior deployment status for diagnosis
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = "https://api.github.com/repos/postmelee/rhwp-fidelity-dashboard/pages/deployments/2a9baa8a50c8529354620b1de465e1bd83ff77f0"
          request = urllib.request.Request(url, headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=30) as response:
              result = json.load(response)
          print(json.dumps({k:result.get(k) for k in ("status","error")}))
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Archive trusted numeric site in the standard Pages format
        run: tar --dereference --hard-dereference --directory site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - id: pages_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          overwrite: true
      - name: Wait for exact artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact-id }}
        run: python3 scripts/wait_pages_artifact.py
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify live historical data
        run: python3 scripts/verify_live_site.py
  supersede_old_publisher:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Stop only the run superseded by the validated Pages fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = "https://api.github.com/repos/postmelee/rhwp-fidelity-dashboard/actions/runs/43750825767"
          headers = {"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:
              result = json.load(response)
          assert result["head_sha"] == "94de8ee28cd1cf52a5e604313f29e3de6d04ef9f"
          if result["status"] != "completed":
              with urllib.request.urlopen(urllib.request.Request(url+"/cancel",headers=headers,method="POST"),timeout=30) as response:
                  assert response.status == 202
              print("Superseded only the known run with the old publisher after recovery verification.")
          else:
              print("Known run already completed.")
          PY
