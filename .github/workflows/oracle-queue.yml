name: Verify oracle queue
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/oracle_queue.py', 'scripts/registered_print_queue.py', 'scripts/local_print_intake.py', 'corpus/print-reference-notes.json', '.github/workflows/oracle-queue.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dashboard
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: upstream
          repository: edwardkim/rhwp
          ref: 2f4f60fbffa1cbed1d7baa8b6d36f40f0940dee0
          persist-credentials: false
      - run: python3 dashboard/scripts/oracle_queue.py upstream queue.json --worklist worklist.json
      - name: Check full path accounting and oracle work items
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          report = json.loads(Path("worklist.json").read_bytes())
          tasks = report["tasks"]
          assert len(tasks) == len({row["path"] for row in tasks}) == 3800
          assert len({row["source_blob"] for row in tasks}) == report["unique_blobs"] == 3651
          assert Counter(row["oracle_state"] for row in tasks) == report["states"]
          assert all(len(row["source_sha256"]) == 64 for row in tasks)
          assert all(any(p["audit_status"] == "verified" for p in row["pdf_candidates"])
                     for row in tasks if row["oracle_state"] == "verified")
          print(report["states"])
          PY
      - name: Verify newer registered Print sources against the pinned inventory
        run: |
          python3 -m pip install pypdfium2==5.13.0 --target "$RUNNER_TEMP/intake-deps"
          PYTHONPATH="$RUNNER_TEMP/intake-deps" python3 dashboard/scripts/registered_print_queue.py \
            321ab8f97791ecf58b56f178f49b7795a836fb79 worklist.json registered-print.json
      - name: Check evidence for same-byte reference reuse
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("registered-print.json").read_bytes())
          aliases = report["alias_review"]
          assert len(aliases) == report["acquisition"]["counts"]["review_same_bytes_reference"]
          assert len({row["path"] for row in aliases}) == len(aliases)
          for row in aliases[:10]:
              print("Alias scope:", json.dumps(row, ensure_ascii=False))
          PY
      - name: Fetch the pinned receipt auditor into the inventory object database
        run: |
          rev=$(PYTHONPATH=dashboard/scripts python3 -c 'from local_print_intake import AUDITOR_REV; print(AUDITOR_REV)')
          git -C upstream fetch --filter=blob:none --depth=1 --no-tags origin "$rev"
      - name: Prepare real local Print inputs and keep a changed digest unmeasured
        run: |
          PYTHONPATH="dashboard/scripts:$RUNNER_TEMP/intake-deps" python3 - <<'PY'
          from pathlib import Path
          from local_print_intake import AUDITOR_REV, prepare
          from corpus_inventory import RECEIPT, REV
          from core import read_json, write_json
          repo = Path("upstream").resolve()
          original = repo / RECEIPT
          rows = read_json(original)["cases"][:2]
          rows[1]["input_sha256"] = "0" * 64
          receipt = Path("test-receipt.json")
          write_json(receipt, {"cases": rows})
          folder = prepare(repo, receipt, Path("intake"), RECEIPT, "2022")
          report = read_json(folder / "intake.json")
          assert report["corpus_sha"] == REV and report["receipt_auditor_sha"] == AUDITOR_REV
          assert report["verified"] == 1 and report["paths"] == 3800
          assert sum(r["receipt_states"].get("mismatch", 0) for r in report["rows"]) == 1
          assert prepare(repo, receipt, Path("intake"), RECEIPT, "2022") == folder
          doc, = read_json(folder / "manifest.json")["documents"]
          assert (folder / doc["golden"]["path"]).is_file()
          batch = Path("print-receipts")
          batch.mkdir()
          rows = read_json(original)["cases"][:2]
          for i, row in enumerate(rows):
              write_json(batch / f"{i}.json", {"cases": [row]})
          result = prepare(repo, batch, Path("intake"), RECEIPT, "2022")
          assert read_json(result / "intake.json")["verified"] == 2
          assert prepare(repo, batch, Path("intake"), RECEIPT, "2022") == result
          write_json(batch / "conflict.json", {"cases": [dict(rows[0], input_sha256="0" * 64)]})
          result = prepare(repo, batch, Path("intake"), RECEIPT, "2022")
          report = read_json(result / "intake.json")
          assert report["verified"] == 1
          assert sum(row["status"] == "conflicting_receipts" for row in report["rows"]) == 1
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oracle-queue
          path: |
            queue.json
            worklist.json
            registered-print.json
          retention-days: 14
