name: Verify Studio browser evidence
on:
  pull_request:
    paths: ['scripts/preview_presentation.py', 'scripts/site/studio-screen.json', 'scripts/check_browser_evidence.py', '.github/workflows/browser-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/check_browser_evidence.py
        env:
          GH_TOKEN: ${{ github.token }}
