name: Track receipt cohort
on:
  push:
    branches: [main]
    paths: [corpus/track-additions.json]
  schedule:
    - cron: '23 */4 * * *'
    - cron: '47 1 * * *'
  pull_request:
    paths: ['scripts/track_cohort.py', 'scripts/stable_preflight.py', 'scripts/receipt_archive.py', 'scripts/pipeline.py', 'scripts/receipt_cohort.py', 'corpus/track-additions.json', '.github/workflows/track-cohort.yml']
  workflow_dispatch:
    inputs:
      track:
        type: choice
        options: [devel, stable]
        default: devel
        description: Upstream track
      retry_devel:
        type: boolean
        default: false
        description: Retry an incomplete measurement at the current devel SHA
permissions:
  contents: read
concurrency:
  group: cohort-track-${{ github.event.pull_request.number || inputs.track || ((github.event_name == 'push' || github.event.schedule == '47 1 * * *') && 'stable' || 'devel') }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        track: [devel, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify additional registered Print pairs with actual file hashes and page counts
        if: matrix.track == 'stable'
        run: |
          python3 -m pip install pypdfium2==5.13.0 --target "$RUNNER_TEMP/pdfcheck"
          PYTHONPATH="scripts:$RUNNER_TEMP/pdfcheck" python3 - <<'PY'
          import hashlib
          import urllib.request
          from urllib.parse import quote
          import pypdfium2
          from receipt_cohort import verify_registered
          from track_cohort import tracked_config
          config = tracked_config()
          verify_registered(config)
          base = "https://raw.githubusercontent.com/edwardkim/rhwp/" + config["corpus_sha"] + "/"
          for row in config["documents"]:
              if "reference_evidence" not in row:
                  continue
              for path, key in (("input", "source_sha256"), ("pdf", "pdf_sha256")):
                  origin = base
                  if path == "pdf" and "reference_revision" in row:
                      origin = "https://raw.githubusercontent.com/edwardkim/rhwp/" + row["reference_revision"] + "/"
                  with urllib.request.urlopen(origin + quote(row[path]), timeout=60) as stream:
                      data = stream.read(32 * 1024 * 1024 + 1)
                  assert len(data) <= 32 * 1024 * 1024 and hashlib.sha256(data).hexdigest() == row[key]
                  if path == "pdf":
                      with pypdfium2.PdfDocument(data) as pdf:
                          assert len(pdf) == row["pages"]
              print(row["input"], row["pages"], "registered Print pages")
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ matrix.track }}
        run: python3 scripts/track_cohort.py plan
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      pilot: ${{ steps.plan.outputs.measure_pilot }}
      expanded: ${{ steps.plan.outputs.measure_expanded }}
      compatibility: ${{ steps.plan.outputs.compatibility }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_DEVEL: ${{ inputs.retry_devel }}
          TRACK: ${{ inputs.track || ((github.event_name == 'push' || github.event.schedule == '47 1 * * *') && 'stable' || 'devel') }}
        run: python3 scripts/track_cohort.py plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.plan.outputs.compatibility == 'true'
        with:
          name: track-cohort-compatibility-${{ github.run_attempt }}
          path: stable-compatibility.json
          if-no-files-found: error
          retention-days: 14
  measure:
    needs: plan
    if: needs.plan.outputs.sha != '' && (needs.plan.outputs.pilot == 'true' || needs.plan.outputs.expanded == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ENGINE_SHA: ${{ needs.plan.outputs.sha }}
      TRACK_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dashboard
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edwardkim/rhwp
          ref: ${{ needs.plan.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install measurement toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev poppler-utils
          python3 -m pip install Pillow==11.3.0 pypdfium2==5.13.0 fonttools==4.60.1 Brotli==1.2.0
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Measure two-page pilot with both renderers
        if: needs.plan.outputs.pilot == 'true'
        run: python3 dashboard/scripts/track_cohort.py pilot
      - name: Measure remaining receipt pairs with both renderers
        if: needs.plan.outputs.expanded == 'true'
        run: python3 dashboard/scripts/track_cohort.py expanded
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: track-cohort-numeric-${{ github.run_attempt }}
          path: work/numeric/*.json
          if-no-files-found: warn
          retention-days: 14
  archive:
    needs: [plan, measure]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.sha != '' || needs.plan.outputs.compatibility == 'true')
    runs-on: ubuntu-24.04
    concurrency: fidelity-ledger
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.measure.result != 'skipped'
        continue-on-error: true
        with:
          name: track-cohort-numeric-${{ github.run_attempt }}
          path: incoming
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.compatibility == 'true'
        with:
          name: track-cohort-compatibility-${{ github.run_attempt }}
          path: preflight
      - env:
          COMPATIBILITY: ${{ needs.plan.outputs.compatibility }}
          ENGINE_SHA: ${{ needs.plan.outputs.sha }}
          TRACK_TAG: ${{ needs.plan.outputs.tag }}
          MEASURE_RESULT: ${{ needs.measure.result }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/track_cohort.py archive
  publish:
    needs: archive
    if: always() && needs.archive.result == 'success'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
