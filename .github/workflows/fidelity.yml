name: Fidelity
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream tag or exact 40-character commit SHA; blank polls latest stable release'
        type: string
        required: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fidelity-ledger
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      needed: ${{ steps.plan.outputs.needed }}
      has_corpus: ${{ steps.plan.outputs.has_corpus }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test trusted code
        run: python3 -m unittest discover -s tests -v
      - id: plan
        name: Poll stable release and resolve immutable commit
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pipeline.py resolve --ref "$REQUESTED_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-plan
          path: plan.json
          retention-days: 14
  measure:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dashboard
          persist-credentials: false
      - name: Full upstream source at exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edwardkim/rhwp
          ref: ${{ needs.resolve.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: needs.resolve.outputs.has_corpus == 'true'
        with:
          python-version: '3.12'
      - name: Install build dependencies
        if: needs.resolve.outputs.has_corpus == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev poppler-utils
          python3 -m pip install Pillow==11.3.0 pypdfium2==5.13.0 fonttools==4.60.1
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Probe, smoke and measure approved corpus
        env:
          ENGINE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 dashboard/scripts/adapter.py upstream dashboard/corpus result.json "$ENGINE_SHA"
      - name: Upload only numeric result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: measurement
          path: result.json
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [resolve, measure]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fresh trusted dashboard checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: trusted-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.resolve.outputs.needed == 'true'
        continue-on-error: true
        with:
          name: measurement
          path: incoming
      - name: Validate whitelist, append durable ledger and build page
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_NEEDED: ${{ needs.resolve.outputs.needed }}
        run: |
          if [ "$MEASUREMENT_NEEDED" = "true" ]; then
            python3 scripts/pipeline.py publish
          else
            python3 scripts/pipeline.py publish --reuse
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Archive trusted numeric site in the standard Pages format
        run: tar --dereference --hard-dereference --directory site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - id: pages_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          overwrite: true
      - name: Wait for exact artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact-id }}
        run: python3 scripts/wait_pages_artifact.py
      - name: Deploy using OIDC
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify deployed public URL and exact JSON
        run: python3 scripts/verify_live_site.py
