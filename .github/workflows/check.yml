name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/pipeline.py build --ledger empty-ledger --out site
      - name: Workflow validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - name: Page HTTP smoke
        run: |
          python3 -m http.server 8000 --directory site > /tmp/fidelity-http.log 2>&1 &
          python3 scripts/http_smoke.py

      - name: Build preview from the pinned public numeric ledger
        if: github.event_name == 'pull_request'
        run: |
          git init "$RUNNER_TEMP/preview-ledger"
          git -C "$RUNNER_TEMP/preview-ledger" fetch --depth=1 https://github.com/postmelee/rhwp-fidelity-dashboard.git 17e6e4463c950c988c93b3ddb1afa09d8e556634
          git -C "$RUNNER_TEMP/preview-ledger" checkout FETCH_HEAD -- records
          python3 scripts/build_preview.py --ledger "$RUNNER_TEMP/preview-ledger" --out preview
      - name: Browser smoke on preview
        if: github.event_name == 'pull_request'
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-test" --no-save --ignore-scripts playwright-core@1.56.1
          export NODE_PATH="$RUNNER_TEMP/browser-test/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          python3 -m http.server 8001 --directory preview > "$RUNNER_TEMP/preview-http.log" 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8001/index.html; then break; fi
            sleep 1
          done
          node tests/dashboard_browser.cjs
      - name: Upload static preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-preview
          path: preview/
          retention-days: 7
