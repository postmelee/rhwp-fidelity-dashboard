name: Receipt-backed release measurement
on:
  pull_request:
    paths:
      - 'corpus/receipt-cohort.json'
      - 'scripts/receipt_cohort.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dashboard
          persist-credentials: false
      - name: Read pinned release
        id: release
        working-directory: dashboard
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          cohort = json.loads(Path("corpus/receipt-cohort.json").read_text())
          sha = cohort["engine_sha"]
          assert re.fullmatch("[a-f0-9]{40}", sha)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("sha=" + sha, file=out)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edwardkim/rhwp
          ref: ${{ steps.release.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install measurement toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev poppler-utils
          python3 -m pip install Pillow==11.3.0 pypdfium2==5.13.0 fonttools==4.60.1 Brotli==1.2.0
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Measure two-page pilot with both renderers
        run: python3 dashboard/scripts/receipt_cohort.py upstream work pilot
      - name: Measure remaining receipt pairs with both renderers
        run: python3 dashboard/scripts/receipt_cohort.py upstream work expanded
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: receipt-cohort-numeric-${{ github.run_attempt }}
          path: work/numeric/*.json
          if-no-files-found: warn
          retention-days: 14
